# grund citation integration for tmux.
# tmux cannot make text clickable, so this binds a key that captures the word
# under the cursor and hands it to the installed `grund-open` resolver, which
# resolves the §<ID> citation and opens its declaration (§FS-integrations).
# Paste into tmux.conf, or let `grund integrations tmux --write` manage it.
#
# prefix + g opens the citation currently copied to the tmux buffer; use copy
# mode to select a §<ID> first, then prefix + g.
bind-key g run-shell 'grund-open "#{buffer_sample}"'
