[package]
name = "grund-core"
version = "0.12.4-dev"
edition.workspace = true
description = "Core engine for grund: scanner, checker, show, fmt, config, and shared data APIs."
keywords = ["documentation", "references", "linter", "agents"]
categories = ["development-tools"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**", "assets/**", "Cargo.toml", "README.md"]

[dependencies]
ignore = "0.4"
regex = "1"
# Only for §FS-config.3.2: "can this ID pattern match a `/`?" is a question about
# the pattern's parsed syntax, not its text. `regex` already builds on this crate
# at the same version, so asking it directly adds nothing to the dependency tree.
regex-syntax = "0.8"
anyhow = "1"
once_cell = "1"
rayon = "1"
unicode-normalization = "0.1"
