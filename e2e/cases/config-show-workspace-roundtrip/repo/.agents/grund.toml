grund_config_version = 1
project_name = "root"
project_description = "Root workspace"

[reference]
marker = "§"
strict = true

[id]
format = "{kind}-{slug}"
slug_pattern = "[a-z][a-z0-9-]*"

[scan]
include = ["docs"]

[workspace]
members = ["apps/api"]
include_root = false

[citations]
default = "may"

[citations.FS]
should = ["GOAL|FS"]
must-not = ["AR"]

[citations.code]
should = ["FS|AR"]
