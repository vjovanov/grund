grund_config_version = 1
project_name = "grund"

[reference]
marker = "§"
trigger = "$$"
strict = true
require_grounding = true
conversation = "link"
inline_style = "citation-with-note"
inline_note_suggested_lines = 1
inline_note_max_lines = 25
inline_note_max_columns = 180
warn_on_suggested = false

[id]
# Slug-only IDs — see FS-config.3.2. Slugs must be unique within a kind.
# Slug must start with a letter so digit-prefixed tokens (e.g. `FS-001`
# in illustrative prose) are not picked up as citations.
format = "{kind}-{slug}"
section_separator = "."
section_heading_levels = "strict"
slug_pattern = "[a-z][a-z0-9-]*"

[[kinds]]
kind = "GRUND"
file = "docs/grund.md"
title = "Why: project motivation"

[[kinds]]
kind = "GOAL"
file = "docs/goals.md"
title = "Where: project direction and outcomes"

[[kinds]]
kind = "FS"
folder = "docs/functional-spec"
title = "What: behavior, requirements, and constraints"

[[kinds]]
kind = "REQ"
folder = "docs/requirements"
title = "Hard requirements: what grund must never break"

[[kinds]]
kind = "AR"
folder = "docs/architecture"
title = "How: high-level implementation, structure, and design"

# DF before DA, matching the canonical default kind order (FS-config.3.4, templates/grund.toml).
[[kinds]]
kind = "DF"
folder = "docs/decisions/functional"
title = "Product behavior decisions and tradeoffs"

[[kinds]]
kind = "DA"
folder = "docs/decisions/architectural"
title = "Architecture decisions and tradeoffs"

# The two test homes are places, not ID namespaces (FS-config.3.4.1,
# FS-config.3.4.4): a test cites the document whose claim it proves and is never
# cited back. The e2e corpus is `tests/e2e/cases/<case>/`, one fixture repository
# plus goldens per case; the harness in crates/grund-cli/tests/e2e.rs runs it and
# carries the per-case form of `must cite FS`, because `spec.refs` is a manifest
# the scanner never reads. The integration home holds the proofs that span more
# than one part — LSP/CLI parity, frontend isolation, CI/pre-commit parity — as
# a workspace member of its own, so Cargo builds them without a `[[test]] path`
# that would reach out of a published crate; tests/integration/README.md lists
# them.
[[kinds]]
kind = "e2e"
folder = "tests/e2e"
citable = false
title = "User scenarios: black-box proof of the spec"

[[kinds]]
kind = "integration"
folder = "tests/integration"
citable = false
title = "Integration tests: proof that the parts fit as designed"

[[kinds]]
kind = "RM"
file = "docs/roadmap.md"
title = "Planned milestones and sequencing"

[[kinds]]
kind = "DISC"
folder = "docs/discussions"
title = "Design discussions and proposals"

# A place, not an ID namespace (FS-config.3.4.1): `skills/` holds agent-facing
# instructions, not specification, so its files declare nothing and its home is
# named by its path everywhere it is shown. Being a home is also what puts it in
# the scan scope — `[scan] include` below does not name it (FS-config.3.5).
[[kinds]]
kind = "skill"
folder = "skills"
citable = false
title = "Agent review and automation skills"

# Four more places (FS-config.3.4.1), each named by its path in the Project map.
# `examples/` holds the user-facing walkthroughs FS-examples asks for, each
# shaped like an e2e case — `repo/` is the fixture, kept out of the scan by
# `[scan] exclude` below, and the README beside it is what gets checked.
[[kinds]]
kind = "example"
folder = "examples"
citable = false
title = "Worked examples: user-facing walkthroughs that double as fixtures"

# The GitHub Actions workflows. Being a home is what scans them now, so
# `[scan] include` no longer names the directory.
[[kinds]]
kind = "workflow"
folder = ".github/workflows"
citable = false
title = "CI and release workflows: the gate on GitHub, and how a release ships"

# The hook checks, the release script, the benchmark tooling, and the PGO
# build. `sh` is in `[scan] extensions` below so the shell scripts here are
# checked beside the Python ones.
[[kinds]]
kind = "script"
folder = "scripts"
citable = false
title = "Repository scripts: hook checks, release preparation, benchmarks, PGO build"

[scan]
# README.md and AGENTS.md are cited surfaces too — scanned so their citations
# are checked, not decorative (REQ-readme.3, REQ-agents-md.4). Every `[[kinds]]`
# home is walked by construction (FS-config.3.5), so the test homes, `examples`,
# `.github/workflows`, and `scripts` are not repeated here.
include = ["docs", "src", "crates", "README.md", "AGENTS.md"]
# `repo` / `expected.repo`: the e2e fixture trees under `tests/e2e/cases/*/` are
# test inputs, not this project's code — keep them out of the host scan so strict
# mode and `require_grounding` (above) apply to grund's own sources, not the
# fixtures. With `e2e` a plain home rather than the `E2E` case kind, this exclude
# is the only thing between the walk and the fixtures.
exclude = ["target", "node_modules", ".git", "dist", "build", ".venv", "repo", "expected.repo", "assets"]
# The allowlist of what the walk reads — the opposite sense of `exclude` above: a
# file is scanned only when its extension is listed (FS-config.3.5). `sh` is here
# for the shell scripts under `scripts/`.
extensions = ["md", "rs", "go", "java", "kt", "ts", "tsx", "js", "py", "c", "cpp", "swift", "scala", "rb", "php", "cs", "lisp", "scm", "clj", "sql", "hs", "lhs", "lua", "ada", "adb", "ads", "yml", "yaml", "sh"]
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
docstring_python = true
respect_gitignore = true

[output]
format = "text"
color = "auto"
relative_paths = true

[fmt.cross_refs]
enabled = true
anchor_format = "github"

# Citation directions (FS-config.3.9, DF-citation-directions): must/must-not gate
# `grund check`; should/should-not surface under `grund check --suggestions`.
[citations]
default = "may"

[citations.GOAL]
should = ["GRUND|GOAL"]

# A hard requirement with no why is a preference, so every REQ names the ground
# it protects; and a promise that must outlive every rewrite of the
# implementation cannot be phrased in terms of it.
[citations.REQ]
should = ["GRUND|GOAL"]
must-not = ["AR"]

[citations.FS]
should = ["GOAL|FS"]
must-not = ["AR"]

[citations.AR]
should = ["FS|GOAL"]

[citations.DF]
should = ["FS|GOAL"]

[citations.DA]
should = ["AR|FS"]

# A scenario proves the What as a user sees it; one that reads the design is not
# black-box. `must` reaches every scanned file in the home — the README — and the
# harness holds the same rule per case over `spec.refs`.
[citations.e2e]
must = ["FS"]
should-not = ["AR"]

# An integration test proves the How: that the parts fit as designed.
[citations.integration]
should = ["AR"]

# A skill tells an agent what to do; the spec is what makes that checkable, so a
# skill file names the behaviour it drives. Never AR: a skill is a user-facing
# procedure, and one written against the implementation rots with it.
[citations.skill]
must = ["FS"]
must-not = ["AR"]

# An example is a user-facing walkthrough of the What, so it names the FS point
# it teaches and never the design.
[citations.example]
must = ["FS"]
must-not = ["AR"]

# Workflows and scripts are implementation: the same rule as `code`.
[citations.workflow]
should = ["FS|AR"]

[citations.script]
should = ["FS|AR"]

[citations.code]
should = ["FS|AR"]
