grund_config_version = 1
project_name = "demo"

# A closed global default (§FS-init.2.3.5): the closing line says so, and the
# one kind that keeps an open default says that it is a hole in it.

[reference]
require_grounding = true

[id]
format = "{kind}-{slug}"

[[kinds]]
kind = "FS"
folder = "docs/functional-spec"
index = false

[[kinds]]
kind = "AR"
folder = "docs/architecture"
index = false

[[kinds]]
kind = "skill"
folder = "skills"
citable = false
title = "Agent skills"

[citations]
default = "must-not"

[citations.FS]
may = ["AR"]
default = "must-not"

[citations.AR]
must = ["FS"]
default = "may"

[citations.skill]
must-not = ["AR"]
