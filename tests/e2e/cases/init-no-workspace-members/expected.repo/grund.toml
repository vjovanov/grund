grund_config_version = 1
project_name = "repo"
# project_description = "<one line shown next to this project in workspace member lists>"

[reference]
marker = "§"
trigger = "$$"
strict = true
require_grounding = false
inline_style = "citation-with-note" # citation-with-note | citation-only
inline_note_suggested_lines = 1
inline_note_max_lines = 3
inline_note_max_columns = 100
inline_note_layout = "any" # any | citation-first-colon
inline_note_layout_check = "off" # off | warn | error
warn_on_suggested = false

[id]
format = "{kind}-{number}-{slug}" # placeholders: {kind} required; use {number}, {slug}, or both
section_separator = "."
section_heading_levels = "strict" # strict | warn | loose
number_pattern = "\\d+"
slug_pattern = "[a-z0-9][a-z0-9-]*"

[[kinds]]
kind = "GRUND"
file = "docs/grund.md"
title = "Why: project motivation"

[[kinds]]
kind = "GOAL"
file = "docs/goals.md"
title = "Where: project direction and outcomes"

[[kinds]]
kind = "FS"
file = "requirements.md"
title = "What: behavior, requirements, and constraints"

[[kinds]]
kind = "AR"
folder = "docs/architecture"
title = "How: high-level implementation, structure, and design"

[[kinds]]
kind = "DF"
folder = "docs/decisions/functional"
title = "Product behavior decisions and tradeoffs"

[[kinds]]
kind = "DA"
folder = "docs/decisions/architectural"
title = "Architecture decisions and tradeoffs"

# A test cites the document whose claim it proves, and is never cited back — so
# the two test kinds are `citable = false`: a home and citation directions, no ID
# namespace. `index` is a folder kind's index file, relative to `folder`; `false`
# opts out. A non-citable kind has no declarations, so it has no index at all.
[[kinds]]
kind = "e2e"
folder = "tests/e2e"
citable = false
title = "User scenarios: black-box proof of the spec"

[[kinds]]
kind = "integration"
folder = "tests/integration"
citable = false
title = "Integration tests: proof that the parts fit as designed"

[[kinds]]
kind = "RM"
file = "docs/roadmap.md"
title = "Planned milestones and sequencing"

[scan]
include = ["requirements.md", "docs", "e2e", "src"]
exclude = ["target", "node_modules", ".git", "dist", "build", ".venv"]
extensions = ["md", "rs", "go", "java", "kt", "ts", "tsx", "js", "py", "c", "cpp", "swift", "scala", "rb", "php", "cs", "lisp", "scm", "clj", "sql", "hs", "lhs", "lua", "ada", "adb", "ads"]
comment_prefixes = ["//", "#", ";", "--", "*", "/*"]
docstring_python = true
respect_gitignore = true

[output]
format = "text" # text | json
color = "auto" # auto | always | never
relative_paths = true

[fmt.cross_refs]
enabled = true
anchor_format = "github" # github | gitlab | mkdocs | pandoc | none

# Citation directions: encode which kinds may cite which, with RFC-2119 levels.
# Entries in one array are all required; `|` inside one entry means any one
# alternative. The complete grammar and a config/render example are at
# https://github.com/vjovanov/grund/blob/main/docs/user-facing/citation-directions.md
# in the grund repository. must/must-not gate `grund check`; should/should-not
# surface under `grund check --suggestions` and render into this entrypoint.
# Uncomment to adopt the canonical climbing ruleset; `code` is the reserved
# pseudo-kind for citation sites outside any kind home.
# [citations]
# default = "may"                # global default level for unlisted pairs
#
# [citations.GOAL]
# should = ["GRUND|GOAL"]
#
# [citations.FS]
# should = ["GOAL|FS"]
# must-not = ["AR"]              # the What may never depend on the How
#
# [citations.AR]
# should = ["FS|GOAL"]
#
# [citations.DF]
# should = ["FS|GOAL"]
#
# [citations.DA]
# should = ["AR|FS"]
#
# [citations.e2e]
# must = ["FS"]                  # a scenario proves a spec…
# should-not = ["AR"]            # …and sees the product as a user does
#
# [citations.integration]
# should = ["AR"]                # the parts fit as the design says they do
#
# [citations.code]
# should = ["FS|AR"]
