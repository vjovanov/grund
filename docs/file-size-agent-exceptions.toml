fissile_exceptions_version = 1
[[exceptions]]
id = "EX-015-api-rs"
path = "crates/grund-core/src/api.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 1592, unit = "lines" }
until = "split by command group, keeping the public entrypoints in api.rs"
reason = """
Public embedding API for every command in one file. Mirrors hard exception EX-003; capped here too so the warning does not fire on every unrelated commit while the split is pending.
"""
