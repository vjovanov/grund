fissile_exceptions_version = 2
# Soft-severity file-size exceptions. An agent may add an entry here on its own;
# hard entries are a human's (§AR-ci.9).
#
# Two shapes live in this file. Most entries carry their own argument. Twelve are
# *soft twins*: a file past the hard budget is past the soft one too, and a
# `deferred` hard entry deliberately leaves the soft finding standing, so the file
# needs an entry in each registry. (A `structural` hard entry silences both tiers
# by itself and wants no twin — this repository has none.) The argument for a twin
# lives once, in `docs/file-size-human-exceptions.toml`, and the twin here points
# at it the way fissile identifies any entry: by registry and path, both already
# on the lines above. Copying the prose instead would give one file two arguments
# that can silently disagree, and `tests/test_file_size_exceptions.py` enforces
# the pointer shape.
[[exceptions]]
path = "crates/grund-core/src/api.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1609, unit = "lines" }
until = "the entry for this path in docs/file-size-human-exceptions.toml is retired"
reason = """
Soft twin of this path's entry in docs/file-size-human-exceptions.toml, which carries the argument. This entry holds no judgment of its own: same ceiling, retires with its twin. Edit the reason there, not here.
"""
