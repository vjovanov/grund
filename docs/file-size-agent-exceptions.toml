[[exceptions]]
path = "crates/grund-cli/src/cli_help.rs"
match = "exact"
rules = ["core-source"]
kind = "structural"
max_accepted = { value = 488, unit = "lines" }
until = "indefinite"
reason = """
The help screens are one user-facing document rendered per command, and their worth is consistency: the same section order, voice, and example style across the 12 command arms and the top-level page. That consistency is held by seeing them together. Scattering them beside their commands makes drift between screens the likeliest failure and produces no compile-time signal when it happens. The file is text, not logic: no state, no branching beyond the command match, nothing to test. Its length tracks the command surface, not accumulated logic: the ceiling moved 486 -> 488 because the one-per-agent rule (§FS-init.2.1.1) made the --claude line too long for a single println!, which is one flag being described accurately rather than logic accruing.
"""
[[exceptions]]
path = "scripts/try-integrations.sh"
match = "exact"
rules = ["scripts"]
kind = "deferred"
until = "it stops being driven by hand and needs automated coverage"
max_accepted = { value = 459, unit = "lines" }
reason = """
A manual smoke script a human reads top to bottom while testing terminals by hand; its linearity is the feature and functions would hide the sequence being followed. The genuine risk is that it has no automated coverage at all, not its length — so the trigger is the day it is run unattended, when the missing tests start to matter and the shape has to change anyway.
"""
[[exceptions]]
path = "crates/grund-core/src/show_render.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 434, unit = "lines" }
until = "move declaration-body extraction out of the renderer"
reason = """
`extract_declaration_body` (208 lines) is the substance: one traversal deciding where a declaration's body begins and ends across Markdown and every supported comment dialect. The per-format renderers around it are thin. The architectural point is that body extraction is a scanner-adjacent concern about source structure and does not belong in a renderer at all. Missing boundary: extraction moved next to the scanner, leaving genuine rendering here.
"""
[[exceptions]]
path = "crates/grund-core/src/fmt_links.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
until = "a third emission profile lands and the planner gains real branching"
max_accepted = { value = 423, unit = "lines" }
reason = """
Link planning (which citations need a link, and to which anchor) and link writing (splice text without disturbing surrounding bytes) are two phases communicating through a plan type, so the seam exists and is clean. It is simply not worth taking at 73 lines over: two files whose combined interface is larger than today's. Revisit when a third emission profile lands (§FS-fmt.6) and the planner gains real branching.
"""
[[exceptions]]
path = "crates/grund-core/src/model.rs"
match = "exact"
rules = ["core-source"]
kind = "structural"
max_accepted = { value = 436, unit = "lines" }
until = "indefinite"
reason = """
`Model` is the shared vocabulary layer of §AR-core-module-layout.1: 25 type definitions against 9 free functions, imported by every other category in the crate. Its size is the width of the domain, not accumulated logic, and a type registry has no internal seam. The ceiling therefore tracks that width and moves with it: adding a `Config` key or a field to a recorded type raises it (429 rather than 424 once the two `inline_note_layout` keys landed, 433 once the run's workspace scope path and the `[workspace]` block's own source location joined `Config`, 434 once `Citation` recorded whether a shorthand sits in a numeric run, 436 once `Config` learned where the run's other workspace projects are), which is the registry growing, not this file accreting logic. Any split groups types by a taxonomy the compiler does not enforce and a reader has to memorise, while every dependent module gains a second place to look. The boundary that would justify splitting is a sub-domain no other category depends on; none exists. Revisit only if such a sub-domain appears.
"""
[[exceptions]]
path = "skills/grund-init/SKILL.md"
match = "exact"
rules = ["entrypoints"]
kind = "structural"
max_accepted = { value = 387, unit = "lines" }
until = "indefinite"
reason = """
This file cannot be split. It is a shipped artifact, not source: init_templates.rs embeds it verbatim via include_str! as AGENT_SETUP_INSTRUCTIONS, `grund agent-setup-instructions` prints exactly those bytes, and a test asserts it is byte-identical to the mirror under crates/grund-core/assets/ (§FS-init.5). Any split either changes the emitted document or makes the command reassemble it at runtime, which moves document structure into code. Its length is the length of the instructions grund promises to emit; the only honest way to shrink it is to promise less.
"""
[[exceptions]]
path = "crates/grund-core/src/list.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
until = "the renderers stop changing with the query"
max_accepted = { value = 368, unit = "lines" }
reason = """
The declaration catalog query and its renderers, 18 lines over budget. They change together — every field the query learns to select is a field the output shapes have to show — so splitting now produces two files that are always opened as a pair. What retires this is that coupling ending, not the file growing.
"""
[[exceptions]]
path = "crates/grund-core/src/shorthand.rs"
match = "exact"
rules = ["core-source"]
kind = "structural"
max_accepted = { value = 485, unit = "lines" }
until = "indefinite"
reason = """
One rule that has to hold identically at four stages: the shape recognized in a file (scanner), accepted as a CLI argument (show/refs), reported (checker), and rewritten (fmt). A divergence between any two of them is precisely the defect DF-number-only-citation-shorthand exists to fix, so the file's cohesion is the invariant, not a stage. The available split is by stage — which is what the categories in AR-core-module-layout.1 already cut by — and it would put the four halves of one contract back in four files with nothing naming the contract, recreating the drift the feature module prevents. What was separable has been separated, and the boundary that separates it is "shape, not rule": the `[id] format` template parser, the ID renderer, and the post-match tests for where a token of that grammar ends — `id_token_ends_cleanly` and the numeric-run test of FS-fmt.2.4.1, both pure functions of the compiled grammar and a string — are grammar rather than shorthand and live in id_format.rs; the live on-type transform is in on_type.rs. What is left is the rule and nothing else, and no sub-part of it is reachable without the derivation above it.
"""
[[exceptions]]
path = "crates/grund-core/src/tests_shorthand.rs"
match = "exact"
rules = ["tests"]
kind = "deferred"
max_accepted = { value = 475, unit = "lines" }
until = "a third shorthand behaviour area earns its own module, the way the rewrite cases already did"
reason = """
The rewrite cases already left, to tests_shorthand_rewrite.rs — that was the seam, and it is spent. What remains is one area: what `check` reports about a shorthand, plus the two surfaces that must agree with it (the CLI argument resolver and the LSP snapshot). These fail together — a change to the recognition boundary or the candidate rule breaks the report, the query, and the editor in one move — so a reader chasing one is chasing all three. A second cut here would be by fixture shape rather than by behaviour, which is the split the tests rule exists to prevent.
"""
