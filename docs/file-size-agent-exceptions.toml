fissile_exceptions_version = 1
# Soft-severity file-size exceptions. An agent may add an entry here on its own;
# hard entries are a human's (§AR-ci.9).
#
# Two shapes live in this file. Most entries carry their own argument. Twelve are
# *soft twins*: a file past the hard budget is past the soft one too, and fissile
# reports both tiers, so the file needs an entry in each registry. The argument
# for those lives once, in `docs/file-size-human-exceptions.toml`, and the twin
# here points at it — the same ceiling, retiring with the entry it names. Copying
# the prose instead would give one file two arguments that can silently disagree,
# and `tests/test_file_size_exceptions.py` enforces the pointer shape.
[[exceptions]]
id = "EX-015-api-rs"
path = "crates/grund-core/src/api.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1592, unit = "lines" }
until = "EX-003-api-rs is retired"
reason = """
Soft twin of EX-003-api-rs, which carries the argument. This entry holds no judgment of its own: same ceiling, retires with its twin. Edit the reason there, not here.
"""
