fissile_exceptions_version = 1
[[exceptions]]
id = "EX-015-api-rs"
path = "crates/grund-core/src/api.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 1592, unit = "lines" }
until = "move the private conversion adapters out, keeping the public contract in api.rs"
reason = """
DEFERRED — the file mixes two things §AR-core-module-layout.2 keeps distinct: the published embedding contract (ShowOpts, CheckOpts, Report, check, show, scan), which genuinely belongs in one file an embedder can read end to end, and the private adapters that convert core types into it (public_report, public_finding, show_with_scope_and_overlays). The contract is the reason to keep one file; the adapters are why it is oversized. Missing boundary: an adapter module for the conversion layer, leaving api.rs as the surface it is documented to be.
"""
[[exceptions]]
id = "EX-016-integrations-rs"
path = "crates/grund-core/src/integrations.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 1525, unit = "lines" }
until = "extract the managed-block protocol as the shared implementation, then split detection from per-client writers"
reason = """
DEFERRED — three responsibilities with no boundary between them: client detection, the managed-block protocol (find, version, migrate, rewrite a delimited block inside a foreign config file), and per-client artifact writing. The middle one is a general mechanism, not an integrations concern — init.rs implements the same protocol again for AGENTS.md — and it is trapped here as private helpers. Missing boundary: the managed-block protocol as one module both callers use.
"""
[[exceptions]]
id = "EX-017-scanner-rs"
path = "crates/grund-core/src/scanner.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 1493, unit = "lines" }
until = "move the pure tokenizer and comment-block helpers out, keeping the single pass intact"
reason = """
DEFERRED — scan_file_text is a genuine single pass: eight pieces of mutable state (fence, Python docstring, current declaration, heading stack, counters) advance together per line, and that loop must not be broken apart. The rest of the file is not that. The citation tokenizer and comment-block classifiers are pure functions over a line, called from the loop and coupled to it only by call. Missing boundary: those pure helpers in a sibling, leaving the walker and its state machine whole (§AR-scanner).
"""
[[exceptions]]
id = "EX-018-shutdown-rs"
path = "crates/grund-lsp/tests/shutdown.rs"
match = "exact"
rules = ["tests"]
max_accepted = { value = 1301, unit = "lines" }
until = "extract the stdio harness as shared test support, then split by LSP request"
reason = """
DEFERRED — every case drives a real LSP server over stdio through one harness that spawns the process, performs the initialize handshake, and tears it down; that harness is the file's actual cohesion, and the file name is an accident of the first case written against it. Missing boundary: the harness as a shared test-support module, after which cases group by the request under test.
"""
[[exceptions]]
id = "EX-019-lib-rs"
path = "crates/grund-lsp/src/lib.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 1229, unit = "lines" }
until = "state the snapshot/line-cache contract, then split handlers by request family"
reason = """
DEFERRED — the 29 request handlers share &mut self on one Server whose snapshot, open_docs, and line_cache carry an invariant: the per-snapshot line cache is valid only between refreshes (§AR-lsp.5). That invariant is why the handlers read as one unit, but Rust allows several impl Server blocks across include!d files, so it does not require one file — it requires the contract to be written down before they move. Missing boundary: that contract stated explicitly, after which handlers split by request family and transport stays in lib.rs.
"""
[[exceptions]]
id = "EX-020-checker-rs"
path = "crates/grund-core/src/checker.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 1128, unit = "lines" }
until = "separate workspace resolution from check_with_workspace, then split the rule families"
reason = """
DEFERRED — the rule families share only an accumulator (&mut CheckReport), which is a weak coupling rather than an architectural one, so this file has no unifying invariant to protect. The obstacle is check_with_workspace: 368 lines that inline workspace resolution, per-project scanning, and diagnostic assembly in one body, so no rule can be lifted until those are separated. Missing boundary: workspace resolution as its own step, after which each rule family moves independently.
"""
[[exceptions]]
id = "EX-021-init-rs"
path = "crates/grund-cli/tests/init.rs"
match = "exact"
rules = ["tests"]
max_accepted = { value = 1023, unit = "lines" }
until = "extract the fixture builder, then split by init scenario"
reason = """
DEFERRED — the cases share a fixture builder that constructs a temp repo and asserts over the emitted tree. Same shape as the LSP suite: the shared harness is real cohesion, its residence in one file is not. Missing boundary: the fixture builder extracted to test support, after which cases split by scenario.
"""
[[exceptions]]
id = "EX-022-init-templates-rs"
path = "crates/grund-core/src/init_templates.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 796, unit = "lines" }
until = "separate the managed-block renderer from the template payload constants"
reason = """
DEFERRED — corrects an earlier reason that described this file as mostly template payload. It is not: 641 of its lines are function bodies and only 10 constants are include_str!. The bulk is rendering logic that composes the AGENTS.md managed block from config — citation directions, inline-style sentences, link construction — sitting among the constants because both are reached from init. Missing boundary: payload and renderer are two jobs, and the renderer belongs beside init.rs.
"""
[[exceptions]]
id = "EX-023-init-rs"
path = "crates/grund-core/src/init.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 776, unit = "lines" }
until = "extract the managed-block machinery and unify it with the integrations.rs implementation"
reason = """
DEFERRED — scaffold writing (create a docs tree, write files that do not yet exist) and the managed agent-entrypoint block (locate, version, migrate, rewrite a document in place) are different operations with different failure modes, sharing this file only because both are reached from init. In-place rewriting of a user's file is the risky half and deserves its own module and its own tests. Missing boundary: that machinery, unified with the duplicate implementation in integrations.rs.
"""
[[exceptions]]
id = "EX-024-config-rs"
path = "crates/grund-core/src/config.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 732, unit = "lines" }
until = "extract the parser with its state made explicit, leaving discovery and defaults here"
reason = """
DEFERRED — parse_config_file is a 409-line hand-written TOML reader: one line-oriented state machine over section and key context, correct only because every branch observes the same state. Splitting it by key group would thread that state through a wider interface, trading a long function for a worse one. Missing boundary: the parser as its own module with its state made explicit, leaving discovery, defaults, and validation here. The ceiling dropped from 936 after the deprecated config command adapter moved to config_cmd.rs.
"""
[[exceptions]]
id = "EX-025-local-benchmark-report-py"
path = "scripts/local-benchmark-report.py"
match = "exact"
rules = ["scripts"]
max_accepted = { value = 534, unit = "lines" }
until = "extract the pure rendering layer so it can be tested"
reason = """
DEFERRED — measurement, aggregation, and report rendering in one script. Rendering is the only part with no I/O and the only part worth testing, and it is currently unreachable from a test. Extracting it makes the script testable, which is the real argument here; the line count is only the symptom.
"""
[[exceptions]]
id = "EX-026-clickable-citations-md"
path = "docs/user-facing/clickable-citations.md"
match = "exact"
rules = ["docs"]
max_accepted = { value = 493, unit = "lines" }
until = "write the shared model explicitly, then split per surface into child documents"
reason = """
DEFERRED — one document covering every surface (PR bodies, reviews, permalinks, local conversations) because the rules are largely stated by contrast with one another, and a reader deciding what to emit needs that comparison in view. Splitting per surface loses it. Missing boundary: a parent stating the shared model with children per surface — which requires the shared model to be written first, since today it exists only implicitly in the contrasts.
"""
[[exceptions]]
id = "EX-027-release-yml"
path = ".github/workflows/release.yml"
match = "exact"
rules = ["workflows"]
max_accepted = { value = 566, unit = "lines" }
until = "extract a reusable workflow if the release job passes 700 lines"
reason = """
DEFERRED — one ordered release pipeline whose only real seam is a workflow_call workflow or a composite action. Taking it trades this file's length for indirection across two files and a second place to look when a release fails at 2am. At 566 lines that trade is not worth making (§AR-ci).
"""
[[exceptions]]
id = "EX-028-cli-help-rs"
path = "crates/grund-cli/src/cli_help.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 477, unit = "lines" }
until = "indefinite — the help text is one artifact; length tracks the command surface"
reason = """
STRUCTURAL — the help screens are one user-facing document rendered per command, and their worth is consistency: the same section order, voice, and example style across all 27 arms. That consistency is held by seeing them together. Scattering them beside their commands makes drift between screens the likeliest failure and produces no compile-time signal when it happens. The file is text, not logic: no state, no branching beyond the command match, nothing to test.
"""
[[exceptions]]
id = "EX-029-try-integrations-sh"
path = "scripts/try-integrations.sh"
match = "exact"
rules = ["scripts"]
max_accepted = { value = 452, unit = "lines" }
until = "promote to a tested crate if it passes 600, or when it stops being run by hand"
reason = """
DEFERRED — a manual smoke script a human reads top to bottom while testing terminals by hand; its linearity is the feature and functions would hide the sequence being followed. The genuine risk is that it has no automated coverage at all, not its length.
"""
[[exceptions]]
id = "EX-030-show-render-rs"
path = "crates/grund-core/src/show_render.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 434, unit = "lines" }
until = "move declaration-body extraction out of the renderer"
reason = """
DEFERRED — extract_declaration_body (209 lines) is the substance: one traversal deciding where a declaration's body begins and ends across Markdown and every supported comment dialect. The per-format renderers around it are thin. The architectural point is that body extraction is a scanner-adjacent concern about source structure and does not belong in a renderer at all. Missing boundary: extraction moved next to the scanner, leaving genuine rendering here.
"""
[[exceptions]]
id = "EX-031-fmt-links-rs"
path = "crates/grund-core/src/fmt_links.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 423, unit = "lines" }
until = "split planning from writing when a third emission profile lands"
reason = """
DEFERRED — link planning (which citations need a link, and to which anchor) and link writing (splice text without disturbing surrounding bytes) are two phases communicating through a plan type, so the seam exists and is clean. It is simply not worth taking at 73 lines over: two files whose combined interface is larger than today's. Revisit when a third emission profile lands (§FS-fmt.6) and the planner gains real branching.
"""
[[exceptions]]
id = "EX-032-model-rs"
path = "crates/grund-core/src/model.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 416, unit = "lines" }
until = "indefinite — revisit only if a self-contained sub-domain of types appears"
reason = """
STRUCTURAL — `model` is the shared vocabulary layer of §AR-core-module-layout.1: 24 type definitions against 9 functions, imported by every other category in the crate. Its size is the width of the domain, not accumulated logic, and a type registry has no internal seam. Any split groups types by a taxonomy the compiler does not enforce and a reader has to memorise, while every dependent module gains a second place to look. The boundary that would justify splitting is a sub-domain no other category depends on; none exists.
"""
[[exceptions]]
id = "EX-033-skill-md"
path = "skills/grund-init/SKILL.md"
match = "exact"
rules = ["docs"]
max_accepted = { value = 385, unit = "lines" }
until = "indefinite — splitting is not a legal move for this file"
reason = """
STRUCTURAL — this file cannot be split. It is a shipped artifact, not source: init_templates.rs embeds it verbatim via include_str! as AGENT_SETUP_INSTRUCTIONS, `grund agent-setup-instructions` prints exactly those bytes, and a test asserts it is byte-identical to the mirror under crates/grund-core/assets/ (§FS-init.5). Any split either changes the emitted document or makes the command reassemble it at runtime, which moves document structure into code. Its length is the length of the instructions grund promises to emit; the only honest way to shrink it is to promise less.
"""
[[exceptions]]
