[[exceptions]]
id = "EX-032-model-rs"
path = "crates/grund-core/src/model.rs"
match = "exact"
rules = ["core-source"]
max_accepted = { value = 416, unit = "lines" }
until = "revisit only if it passes 550, or if a clear sub-domain of types appears"
reason = """
Shared data types and small helpers used by every command (§AR-core-module-layout.1). A type registry is legitimately long: splitting it scatters definitions that are always read together and buys no boundary.
"""
[[exceptions]]
id = "EX-033-skill-md"
path = "skills/grund-init/SKILL.md"
match = "exact"
rules = ["docs"]
max_accepted = { value = 385, unit = "lines" }
until = "indefinite — splitting is not a legal move for this file"
reason = """
PERMANENT. A shipped SKILL.md is a single-file contract: it is byte-mirrored into crates/grund-core/assets/, embedded via include_str! as AGENT_SETUP_INSTRUCTIONS, printed whole by grund agent-setup-instructions, and asserted byte-identical by test (§FS-init.5). Splitting it would change emitted bytes and break the command's output.
"""
