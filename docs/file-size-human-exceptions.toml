fissile_exceptions_version = 2
# Hard-severity file-size exceptions, each a human's to add (§AR-ci.9). An entry
# is identified by this registry and its `path`, which is why it carries no name
# of its own.
#
# Two entries were retired when their files were split: crates/grund-core/src/
# tests.rs (4111 lines) into thirteen `tests_*` category modules plus
# `tests_support`, and crates/grund-cli/src/cli.rs (1735 lines) into one file per
# command. Both are now under budget with no exception.
[[exceptions]]
path = "crates/grund-core/src/api.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1598, unit = "lines" }
until = "move the private conversion adapters out, keeping the public contract in api.rs"
reason = """
The file mixes two things §AR-core-module-layout.2 keeps distinct: the published embedding contract (ShowOpts, CheckOpts, Report, check, show, scan), which genuinely belongs in one file an embedder can read end to end, and the private adapters that convert core types into it (public_report, public_finding, show_with_scope_and_overlays). The contract is the reason to keep one file; the adapters are why it is oversized. Missing boundary: an adapter module for the conversion layer, leaving api.rs as the surface it is documented to be.
"""
[[exceptions]]
path = "crates/grund-core/src/integrations.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1525, unit = "lines" }
until = "extract the managed-block protocol as the shared implementation, then split detection from per-client writers"
reason = """
Three responsibilities with no boundary between them: client detection, the managed-block protocol (find, version, migrate, rewrite a delimited block inside a foreign config file), and per-client artifact writing. The middle one is a general mechanism, not an integrations concern — init.rs implements the same protocol again for AGENTS.md — and it is trapped here as private helpers. Missing boundary: the managed-block protocol as one module both callers use.
"""
[[exceptions]]
path = "crates/grund-core/src/scanner.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1493, unit = "lines" }
until = "move the pure tokenizer and comment-block helpers out, keeping the single pass intact"
reason = """
The `scan_file_text` loop is a genuine single pass: eight pieces of mutable state (fence, Python docstring, current declaration, heading stack, counters) advance together per line, and that loop must not be broken apart. The rest of the file is not that. The citation tokenizer and comment-block classifiers are pure functions over a line, called from the loop and coupled to it only by call. Missing boundary: those pure helpers in a sibling, leaving the walker and its state machine whole (§AR-scanner).
"""
[[exceptions]]
path = "crates/grund-lsp/tests/shutdown.rs"
match = "exact"
rules = ["tests"]
kind = "deferred"
max_accepted = { value = 1301, unit = "lines" }
until = "extract the stdio harness as shared test support, then split by LSP request"
reason = """
Every case drives a real LSP server over stdio through one harness that spawns the process, performs the initialize handshake, and tears it down; that harness is the file's actual cohesion, and the file name is an accident of the first case written against it. Missing boundary: the harness as a shared test-support module, after which cases group by the request under test.
"""
[[exceptions]]
path = "crates/grund-lsp/src/lib.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1229, unit = "lines" }
until = "state the snapshot/line-cache contract, then split handlers by request family"
reason = """
The handlers behind the 12 dispatch arms (6 requests, 6 notifications) share &mut self on one impl Server whose snapshot, open_docs, and line_cache carry an invariant: the per-snapshot line cache is valid only between refreshes (§AR-lsp.5). That invariant is why they read as one unit, but Rust allows several impl Server blocks across include!d files, so it does not require one file — it requires the contract to be written down before they move. Missing boundary: that contract stated explicitly, after which handlers split by request family and transport stays in lib.rs.
"""
[[exceptions]]
path = "crates/grund-core/src/checker.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1128, unit = "lines" }
until = "separate workspace resolution from check_with_workspace, then split the rule families"
reason = """
The rule families share only an accumulator (&mut CheckReport), which is a weak coupling rather than an architectural one, so this file has no unifying invariant to protect. The obstacle is check_with_workspace: 363 lines that inline workspace resolution, per-project scanning, and diagnostic assembly in one body, so no rule can be lifted until those are separated. Missing boundary: workspace resolution as its own step, after which each rule family moves independently.
"""
[[exceptions]]
path = "crates/grund-cli/tests/init.rs"
match = "exact"
rules = ["tests"]
kind = "deferred"
max_accepted = { value = 1023, unit = "lines" }
until = "extract the fixture builder, then split by init scenario"
reason = """
The cases share a fixture builder that constructs a temp repo and asserts over the emitted tree. Same shape as the LSP suite: the shared harness is real cohesion, its residence in one file is not. Missing boundary: the fixture builder extracted to test support, after which cases split by scenario.
"""
[[exceptions]]
path = "crates/grund-core/src/config.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 732, unit = "lines" }
until = "extract the parser with its state made explicit, leaving discovery and defaults here"
reason = """
`parse_config_file` is a 409-line hand-written TOML reader: one line-oriented state machine over section and key context, correct only because every branch observes the same state. Splitting it by key group would thread that state through a wider interface, trading a long function for a worse one. Missing boundary: the parser as its own module with its state made explicit, leaving discovery, defaults, and validation here. The ceiling dropped from 936 after the deprecated config command adapter moved to config_cmd.rs.
"""
[[exceptions]]
path = "crates/grund-core/src/init_templates.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 796, unit = "lines" }
until = "separate the managed-block renderer from the template payload constants"
reason = """
Corrects an earlier reason that described this file as mostly template payload. It is not: 641 of its lines are function bodies and only 10 constants are include_str!. The bulk is rendering logic that composes the AGENTS.md managed block from config — citation directions, inline-style sentences, link construction — sitting among the constants because both are reached from init. Missing boundary: payload and renderer are two jobs, and the renderer belongs beside init.rs.
"""
[[exceptions]]
path = "crates/grund-core/src/init.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 776, unit = "lines" }
until = "extract the managed-block machinery and unify it with the integrations.rs implementation"
reason = """
Scaffold writing (create a docs tree, write files that do not yet exist) and the managed agent-entrypoint block (locate, version, migrate, rewrite a document in place) are different operations with different failure modes, sharing this file only because both are reached from init. In-place rewriting of a user's file is the risky half and deserves its own module and its own tests. Missing boundary: that machinery, unified with the duplicate implementation in integrations.rs.
"""
[[exceptions]]
path = "scripts/local-benchmark-report.py"
match = "exact"
rules = ["scripts"]
kind = "deferred"
max_accepted = { value = 534, unit = "lines" }
until = "extract the pure rendering layer so it can be tested"
reason = """
Measurement, aggregation, and report rendering in one script. Rendering is the only part with no I/O and the only part worth testing, and it is currently unreachable from a test. Extracting it makes the script testable, which is the real argument here; the line count is only the symptom.
"""
[[exceptions]]
path = "docs/user-facing/clickable-citations.md"
match = "exact"
rules = ["docs"]
kind = "deferred"
max_accepted = { value = 493, unit = "lines" }
until = "write the shared model explicitly, then split per surface into child documents"
reason = """
One document covering every surface (PR bodies, reviews, permalinks, local conversations) because the rules are largely stated by contrast with one another, and a reader deciding what to emit needs that comparison in view. Splitting per surface loses it. Missing boundary: a parent stating the shared model with children per surface — which requires the shared model to be written first, since today it exists only implicitly in the contrasts.
"""
