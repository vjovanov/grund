fissile_exceptions_version = 2
# Hard-severity file-size exceptions, each a human's to add (§AR-ci.9). An entry
# is identified by this registry and its `path`, which is why it carries no name
# of its own.
#
# Three entries were retired when their files were split: crates/grund-core/src/
# tests.rs (4111 lines) into thirteen `tests_*` category modules plus
# `tests_support`, crates/grund-cli/src/cli.rs (1735 lines) into one file per
# command, and crates/grund-cli/tests/init.rs (1023 lines) into the scaffold
# cases and the entrypoint-selection cases over a shared fixture, which is what
# its `until` asked for. All three are now under budget with no exception.
[[exceptions]]
path = "crates/grund-core/src/api.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1609, unit = "lines" }
until = "move the private conversion adapters out, keeping the public contract in api.rs"
reason = """
The file mixes two things §AR-core-module-layout.2 keeps distinct: the published embedding contract (ShowOpts, CheckOpts, Report, check, show, scan), which genuinely belongs in one file an embedder can read end to end, and the private adapters that convert core types into it (public_report, public_finding, show_with_scope_and_overlays). The contract is the reason to keep one file; the adapters are why it is oversized. Missing boundary: an adapter module for the conversion layer, leaving api.rs as the surface it is documented to be.
"""
[[exceptions]]
path = "crates/grund-core/src/integrations.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1525, unit = "lines" }
until = "extract the managed-block protocol as the shared implementation, then split detection from per-client writers"
reason = """
Three responsibilities with no boundary between them: client detection, the managed-block protocol (find, version, migrate, rewrite a delimited block inside a foreign config file), and per-client artifact writing. The middle one is a general mechanism, not an integrations concern — init.rs implements the same protocol again for AGENTS.md — and it is trapped here as private helpers. Missing boundary: the managed-block protocol as one module both callers use.
"""
[[exceptions]]
path = "crates/grund-core/src/scanner.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1300, unit = "lines" }
until = "move the comment-block classifiers out, keeping the single pass intact"
reason = """
The `scan_file_text` loop is a genuine single pass: eight pieces of mutable state (fence, Python docstring, current declaration, heading stack, counters) advance together per line, and that loop must not be broken apart. The rest of the file is not that. Most of the named boundary has now been taken. The note-reading helpers — comment-prefix stripping, citation-token removal, and the note-presence verdict — left for inline_note_layout.rs with the layout classifier that shares them (1523 -> 1461), the block's note verdicts then came back in one call rather than two (-> 1456), and the citation tokenizer itself left for comment_line.rs (-> 1383), where it sits beside the line-reduction helpers that are now its only callers; the qualified-citation pass then kept the target it parsed with, to ask the numeric-run question with that grammar (-> 1394). The tree walk itself then left for scanner_walk.rs (-> 1237) — §AR-scanner.1 is a directory traversal and §AR-scanner.2 is this line-by-line pass, and they meet only at the file list one hands the other. What is still here is the comment-block classifiers — which marker opens a block, where a docstring closes, whether a block declares an ID — pure functions over a line called from the loop and coupled to it only by call. Missing boundary: those in a sibling too, leaving the walker and its state machine whole (§AR-scanner).
"""
[[exceptions]]
path = "crates/grund-lsp/tests/shutdown.rs"
match = "exact"
rules = ["tests"]
kind = "deferred"
max_accepted = { value = 765, unit = "lines" }
until = "the remaining cases are grouped into suites named for the request they drive, in one move"
reason = """
Nine cases that share a process, not a subject: each builds its own fixture tree and asserts over the JSON-RPC answers of one request family — lifecycle, diagnostics, definition, references, document links, highlight — and they sit together only because this file was the first one written against a real server. Both things that used to hold them here are gone: the stdio harness (spawn, initialize handshake, framed send/receive, teardown) is `crates/grund-lsp/tests/support/mod.rs` and every case in this file now starts from it, and every hover case moved to `tests/hover.rs` — the request appears here only as the vehicle of the malformed-message case, whose subject is the loop surviving rather than the answer — which is what dropped the ceiling from 1301 to 765. Missing boundary: the grouping itself — which request families make one suite — decided once for the whole file and applied in a single move with the assertions untouched, rather than a case at a time behind whichever feature happens to be landing.
"""
[[exceptions]]
path = "crates/grund-lsp/src/lib.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 1208, unit = "lines" }
until = "state the snapshot/line-cache contract, then split handlers by request family"
reason = """
The handlers behind the 12 dispatch arms (6 requests, 6 notifications) share &mut self on one impl Server whose snapshot, open_docs, and line_cache carry an invariant: the per-snapshot line cache is valid only between refreshes (§AR-lsp.5). That invariant is why they read as one unit, but Rust allows several impl Server blocks across include!d files, so it does not require one file — it requires the contract to be written down before they move. Missing boundary: that contract stated explicitly, after which handlers split by request family and transport stays in lib.rs.
"""
[[exceptions]]
path = "crates/grund-core/src/checker.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 770, unit = "lines" }
until = "the six rule bodies still inline in check_with_workspace become named functions"
reason = """
The reference-resolution family has already left, to checker_references.rs, the inline citation style rule with it, to inline_note_layout.rs, and the section-shape family — heading-level strictness beside the new duplicate-section rule — to checker_sections.rs, which is what dropped the ceiling 1083 -> 1013 -> 1000, and the citation-direction family — the obligation and prohibition passes — to checker_citations.rs, taking it to 770. What remains is blocked for a different reason. Six rules — duplicate homes, configured kind homes, the escaped-citation suggestion, broken stub links, unused declarations, and the grounding floor — are written as inline blocks inside one body of check_with_workspace, sharing a KindHomeIndex, repeated passes over findings.declarations, and one &mut CheckReport. They are statements, not functions, so there is nothing to move yet. Missing boundary: each of them named, after which the declaration-placement rules leave as one family and this file keeps the citation-side rules and the shared diagnostic helpers.
"""
[[exceptions]]
path = "crates/grund-core/src/config.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 732, unit = "lines" }
until = "extract the parser with its state made explicit, leaving discovery and defaults here"
reason = """
`parse_config_file` is a 409-line hand-written TOML reader: one line-oriented state machine over section and key context, correct only because every branch observes the same state. Splitting it by key group would thread that state through a wider interface, trading a long function for a worse one. Missing boundary: the parser as its own module with its state made explicit, leaving discovery, defaults, and validation here. The ceiling dropped from 936 after the deprecated config command adapter moved to config_cmd.rs.
"""
[[exceptions]]
path = "crates/grund-core/src/init.rs"
match = "exact"
rules = ["core-source"]
kind = "deferred"
max_accepted = { value = 529, unit = "lines" }
until = "unify init_block.rs with the second implementation of the same protocol in integrations.rs"
reason = """
Half of this entry is paid: the managed agent-entrypoint block — locate, version, migrate, rewrite a document in place — left for init_block.rs, and the ceiling dropped from 776 with it; the run's entrypoint plan then left for init_plan.rs, taking it to 529. What is left here is scaffold writing, the run, and its report, which is one job. The debt that remains is the one this file cannot pay alone: integrations.rs implements the same locate-version-splice protocol a second time for foreign config files, and two implementations of in-place rewriting of a user's file is the risk worth naming. Missing boundary: one managed-block protocol both callers use.
"""
[[exceptions]]
path = "scripts/local-benchmark-report.py"
match = "exact"
rules = ["scripts"]
kind = "deferred"
max_accepted = { value = 534, unit = "lines" }
until = "extract the pure rendering layer so it can be tested"
reason = """
Measurement, aggregation, and report rendering in one script. Rendering is the only part with no I/O and the only part worth testing, and it is currently unreachable from a test. Extracting it makes the script testable, which is the real argument here; the line count is only the symptom.
"""
